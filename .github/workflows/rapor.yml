name: Haftalik Rapor

on:
  schedule:
    - cron: "0 6 * * 1"   # her pazartesi 09:00 TR
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Raporu üret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python rapor.py
      - name: Raporu kaydet
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add raporlar
          git diff --cached --quiet || { git commit -qm "haftalik rapor" && git pull -q --rebase && git push -q; }
